<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Football Power Rankings & Elo Model</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Export Libraries via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div class="max-w-[1600px] mx-auto px-4 py-8">
    
    <!-- Top Header Navigation -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center pb-6 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight text-white">CFB Power Rankings & Elo Engine</h1>
        <p class="text-slate-400 text-sm mt-1">134-Team FBS Asymmetric Model & Decoupled Venue Intelligence</p>
      </div>
      <nav class="flex gap-2 bg-slate-900 p-1.5 rounded-lg border border-slate-800">
        <button onclick="switchTab('rankings')" id="tab-rankings" class="px-4 py-2 rounded-md font-semibold text-sm bg-blue-600 text-white shadow-lg shadow-blue-600/30">Rankings</button>
        <button onclick="switchTab('conferences')" id="tab-conferences" class="px-4 py-2 rounded-md font-semibold text-sm text-slate-400 hover:text-white transition-colors">Conferences</button>
        <button onclick="switchTab('venues')" id="tab-venues" class="px-4 py-2 rounded-md font-semibold text-sm text-slate-400 hover:text-white transition-colors">Venues</button>
        <a href="docs.html" class="px-4 py-2 rounded-md font-semibold text-sm text-slate-400 hover:text-white transition-colors">Formulas & Docs</a>
      </nav>
    </header>

    <!-- Controls, Dropdowns & Search -->
    <div class="my-6 flex flex-wrap gap-4 items-center justify-between bg-slate-900/60 p-4 rounded-xl border border-slate-800/80">
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Mode</label>
          <select id="modeSelect" onchange="onModeChange()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
            <option value="single">Single Season</option>
            <option value="multi">Multi-Year Range</option>
          </select>
        </div>
        <div id="seasonContainer">
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Season</label>
          <select id="seasonSelect" onchange="onSeasonChange()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
            <option value="2026" selected>2026 (Current)</option>
            <option value="2025">2025</option>
          </select>
        </div>
        <div id="weekContainer">
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Week</label>
          <select id="weekSelect" onchange="loadRankings()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
            <option value="latest" selected>Latest</option>
          </select>
        </div>
        <div id="rangeContainer" class="hidden">
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Range Window</label>
          <select id="rangeSelect" onchange="loadRankings()" class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-3 py-2 outline-none">
            <option value="3yr">Last 3 Years (2024-2026)</option>
            <option value="5yr">Last 5 Years (2022-2026)</option>
            <option value="10yr">Last 10 Years (2017-2026)</option>
            <option value="30yr">Last 30 Years (1997-2026)</option>
          </select>
        </div>
      </div>
      
      <!-- Search & Export Controls -->
      <div class="flex flex-wrap items-center gap-4">
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Search Database</label>
          <input type="text" id="searchInput" oninput="renderCurrentTable()" placeholder="Search team or conference..." class="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg px-4 py-2 outline-none focus:border-blue-500 w-64">
        </div>
        <div>
          <label class="block text-xs uppercase font-bold text-slate-400 mb-1">Export View</label>
          <div class="flex gap-1.5">
            <button onclick="exportCurrentTable('csv')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition-colors">CSV</button>
            <button onclick="exportCurrentTable('json')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition-colors">JSON</button>
            <button onclick="exportCurrentTable('pdf')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs font-semibold px-3 py-2 rounded-lg transition-colors">PDF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Output Table -->
    <div id="tableContainer" class="overflow-x-auto bg-slate-900 rounded-xl border border-slate-800 shadow-xl">
      <table class="w-full text-left border-collapse whitespace-nowrap" id="dataTable">
        <thead class="bg-slate-800/90 text-slate-300 text-xs uppercase tracking-wider font-bold" id="tableHead"></thead>
        <tbody class="divide-y divide-slate-800 text-sm font-medium" id="tableBody"></tbody>
      </table>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
